name: Deploy contact receipt service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pageatelier-contact-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check account connections
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          names=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','RESEND_API_KEY','TURNSTILE_SECRET_KEY']
          missing=[n for n in names if not os.environ.get(n)]
          if missing:raise SystemExit('Missing connections: '+', '.join(missing)+'. Nothing deployed.')
          PY
      - name: Verify email processing without sending email
        run: node --test tests/contact/*.test.mjs
      - name: Install locked deploy tooling
        working-directory: integrations/contact
        run: npm ci --no-audit --no-fund
      - name: Register initial workers.dev address when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/subdomain'
          def request(method, body=None):
              req=urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                  headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type':'application/json'}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  return json.load(error)
          existing=request('GET')
          if existing.get('success'):
              print('Existing workers.dev address preserved.')
          elif any(e.get('code')==10007 for e in existing.get('errors', [])):
              result=request('PUT', {'subdomain':'pageatelier-'+account[:8]})
              if not result.get('success'):
                  codes=[e.get('code') for e in result.get('errors', [])]
                  raise SystemExit('Initial address registration requires account-owner action. API error codes: '+str(codes))
              print('Initial workers.dev address registered.')
          else:
              codes=[e.get('code') for e in existing.get('errors', [])]
              raise SystemExit('Could not inspect account address. API error codes: '+str(codes))
          PYTHON
      - name: Build and deploy Worker
        working-directory: integrations/contact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run check
          npm run deploy
      - name: Store sending secrets in the Worker
        working-directory: integrations/contact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          data={k:os.environ[k] for k in ['RESEND_API_KEY','TURNSTILE_SECRET_KEY']}
          subprocess.run(['./node_modules/.bin/wrangler','secret','bulk'],input=json.dumps(data),text=True,check=True)
          PY
      - name: Verify public endpoint without sending email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/subdomain', headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response: subdomain=json.load(response)['result']['subdomain']
          endpoint='https://pageatelier-contact.'+subdomain+'.workers.dev/contact'
          for attempt in range(10):
              try:
                  req=urllib.request.Request(endpoint, method='OPTIONS', headers={'Origin':'https://pageatelier.jp'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      assert response.status==204 and response.headers.get('Access-Control-Allow-Origin')=='https://pageatelier.jp'
                  break
              except Exception:
                  if attempt==9: raise SystemExit('Public endpoint not ready. Website transport remains unchanged.')
                  time.sleep(5)
          req=urllib.request.Request(endpoint, method='POST', data=b'{}', headers={'Origin':'https://pageatelier.jp','Content-Type':'application/json'})
          try: urllib.request.urlopen(req, timeout=15)
          except urllib.error.HTTPError as response:
              assert response.code==400 and json.load(response).get('code')=='invalid'
          else: raise SystemExit('Invalid request was unexpectedly accepted.')
          print('Public endpoint ready; invalid request rejected without sending email: '+endpoint)
          PYTHON
      - name: Report service deployment only
        run: echo 'Worker deployed. Site transport is unchanged. Verify DNS, privacy disclosures, Turnstile and both inboxes before activation.'
